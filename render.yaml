services:
  # Backend API. autoDeploy: false matches the deal_cloud_enhancer convention --
  # pushes don't auto-deploy; trigger manually from dashboard or API. Keeps
  # pipeline-minute usage proportional to actual work.
  - type: web
    name: deal-research-workflow-api
    runtime: python
    autoDeploy: false
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0

  # Frontend SPA, served as static files via Render's static site type.
  - type: web
    name: deal-research-workflow-web
    runtime: static
    autoDeploy: false
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback so deep-link URLs resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
