services:
  # Backend API. autoDeploy: false matches the deal_cloud_enhancer convention --
  # pushes don't auto-deploy; trigger manually from dashboard or API. Keeps
  # pipeline-minute usage proportional to actual work.
  - type: web
    # Renamed from `deal-research-workflow-api` 2026-07-23 -- that slug's
    # Render routing/edge layer got into a broken state that caused
    # sporadic net::ERR_CONNECTION_RESET / ERR_CONNECTION_CLOSED /
    # ERR_QUIC_PROTOCOL_ERROR on every request, reproducible from two
    # completely independent clients (browser + an unrelated sandboxed
    # shell) against a freshly recreated, health-check-verified-healthy
    # origin -- ruling out our code, DB, and client network as the cause.
    # A second throwaway service under a different name on the same
    # account/region/code worked flawlessly, isolating the problem to
    # that specific hostname's routing state. Cut over to this new slug
    # (frontend VITE_API_BASE_URL + Slack app event/command/interactivity
    # URLs updated accordingly) rather than wait on a support fix. The
    # old service was deleted; if this recurs, suspect the SAME failure
    # mode on this slug rather than assuming it's new.
    name: deal-research-workflow-api-v2
    runtime: python
    autoDeploy: false
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /healthz
    # --timeout-keep-alive: uvicorn's default is 5s. Cheap insurance
    # against any reverse-proxy/CDN reusing idle edge-to-origin
    # connections longer than that (harmless here even though this
    # host isn't Cloudflare-fronted -- see rename note above for the
    # actual root cause of the 2026-07-23 outage).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      # Todd the Walrus -- Slack credentials. Set in Render dashboard
      # after blueprint sync; signing secret is on the Slack app's
      # "Basic Information" page, bot token on "OAuth & Permissions".
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # ToltIQ -- Phase 4 ad-hoc question tool against built data rooms.
      # Same values the deal_cloud_enhancer cron uses; set in the
      # Render dashboard.
      - key: TOLTIQ_BASE_URL
        sync: false
      - key: TOLTIQ_API_KEY
        sync: false
      - key: TOLTIQ_ORG_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0

  # Frontend SPA, served as static files via Render's static site type.
  - type: web
    name: deal-research-workflow-web
    runtime: static
    autoDeploy: false
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback so deep-link URLs resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
