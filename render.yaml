services:
  # Backend API. autoDeploy: false matches the deal_cloud_enhancer convention --
  # pushes don't auto-deploy; trigger manually from dashboard or API. Keeps
  # pipeline-minute usage proportional to actual work.
  - type: web
    name: deal-research-workflow-api
    runtime: python
    autoDeploy: false
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --timeout-keep-alive: uvicorn's default is 5s, well under the idle
    # window Render's edge (Cloudflare) uses when reusing a pooled
    # edge-to-origin connection. Once a connection sits idle for >5s,
    # uvicorn closes its end while the edge still thinks it's live --
    # the client's next request on that stale connection dies with
    # net::ERR_CONNECTION_RESET / ERR_CONNECTION_CLOSED (occasionally
    # ERR_QUIC_PROTOCOL_ERROR on the first hop). Root-caused 2026-07-23
    # from sporadic "Failed to fetch" on the one-pager web view -- the
    # same errors were reproducible from a second, unrelated client,
    # ruling out a client-side network cause. 75s comfortably exceeds
    # typical CDN/proxy keep-alive reuse windows (matches nginx's classic
    # default).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      # Todd the Walrus -- Slack credentials. Set in Render dashboard
      # after blueprint sync; signing secret is on the Slack app's
      # "Basic Information" page, bot token on "OAuth & Permissions".
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # ToltIQ -- Phase 4 ad-hoc question tool against built data rooms.
      # Same values the deal_cloud_enhancer cron uses; set in the
      # Render dashboard.
      - key: TOLTIQ_BASE_URL
        sync: false
      - key: TOLTIQ_API_KEY
        sync: false
      - key: TOLTIQ_ORG_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0

  # Frontend SPA, served as static files via Render's static site type.
  - type: web
    name: deal-research-workflow-web
    runtime: static
    autoDeploy: false
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback so deep-link URLs resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
